schema_version: '1.0'
task_id: qsc-004
claims:
  - id: EN07-C1
    claim: Hourly dispatch must couple commitment transitions, ramp limits, and supply-demand balance under the explicit input contract.
    sources: [EN-07 candidate expert pack, PYPSA-DOCS candidate source index]
    applicability: Synthetic one-hour periods, no transmission network, losses, market settlement, or reserve product.
    independent_check: Directly recompute transition flags, ramp deltas, and the energy balance from emitted records; small cases have hand-derived values.
    status: Candidate-source context; behavior independently checked against this task's stated model contract.
  - id: EN04-C1
    claim: Stored energy changes by charge_efficiency times bus-side charging energy minus bus-side discharge energy divided by discharge_efficiency.
    sources: [EN-04 candidate expert pack, PYPSA-DOCS candidate source index]
    applicability: Fixed capacity and one-hour intervals; no degradation, auxiliary consumption, or self-discharge.
    independent_check: "Two-period hand calculation: 2 + 0.9*2 - 2/0.8 = 1.3 MWh, with intermediate state 3.8 MWh."
    status: Candidate-source context; arithmetic independently checked for the stated assumptions.
  - id: EN07-C2
    claim: Renewable supply, thermal output, storage charge/discharge, curtailment, and unserved demand must close the per-period balance.
    sources: [EIA-ELECTRICITY candidate source index, EN-07 candidate expert pack]
    applicability: This task's single-bus synthetic dispatch accounting; no real grid measurements are represented.
    independent_check: Assert the declared balance identity and calculate expected values for renewable surplus, battery discharge, and unserved load fixtures.
    status: Candidate-source context; task-specific numeric expectations independently hand-checked.
limitations:
  - Expert-pack source indexes are candidate research leads, not standalone authority or evidence of formal expert certification.
  - No qualified external domain reviewer has signed off the package.
  - Harbor Oracle/NOP and valid DeepSeek Chat trial evidence is pending for the current source revision.
